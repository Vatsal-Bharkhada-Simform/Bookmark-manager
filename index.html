<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Store your bookmarks and web profiles in ZenTabs. Open saved profiles anytime, reducing prep time.">
    
    <title>ZenTabs</title>
    
    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./styles/main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <dialog class="dialog__add-bookmark">
            <form method="dialog" id="add-bookmark-form" class="dialog__wrapper">
                <div class="dialog__head">
                    <h2>Add Bookmark</h2>
                    <button type="button" id="dialog-cancel" title="Close dialog" class="button-ghost">
                        <svg class="u-icon">
                            <use href="./assets/icons/sprite.svg#close"></use>
                        </svg>
                    </button>
                </div>
                <div class="dialog__body">
                    <div class="input-wrapper">
                        <label for="bookmark-title">Name</label>
                        <input  class="input-primary" type="text" id="bookmark-title" name="bookmark-title" placeholder="Enter bookmark name" required>
                    </div>

                    <div class="input-wrapper">
                        <label for="bookmark-url">URL</label>
                        <input  class="input-primary" type="url" id="bookmark-url" name="bookmark-url" placeholder="Enter bookmark URL" required>
                    </div>

                    <div class="input-wrapper">
                        <label for="bookmark-tags">Tags <span>(Add name and press enter to create tag)</span></label>
                        <div class="tag-container">
                            <div class="tag-list"></div>
                            <input  class="input-primary" type="text" id="bookmark-tags" name="bookmark-tags" placeholder="e.g. React, JavaScript">
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <label for="bookmark-collections">Collections <span>(Add name and press enter to create collection)</span></label>
                        <div class="collection-container">
                            <div class="collection-list"></div>
                            <input  class="input-primary" type="text" id="bookmark-collections" name="bookmark-collections" placeholder="e.g. Frontend, Learning">
                        </div>
                    </div>
                </div>
                <div class="dialog__actions">
                    <button type="submit" id="dialog-confirm" class="button-primary">Add Bookmark</button>
                </div>
            </form>
    </dialog>
    <div class="root__wrapper">
        <header class="header">
            <div class="header__name">
                <button type="button" class="button-ghost" title="Open sidebar">
                    <svg class="u-icon">
                        <use href="./assets/icons/sprite.svg#menu"></use>
                    </svg>
                </button>
                <h1>ZenTabs</h1>
            </div>
            <div class="header__main">
                <form name="search-form" class="header__search u-search">
                    <input type="search" title="Search for bookmarks and profiles" name="search" placeholder="Search for bookmarks and profiles">
                    <button type="submit" title="search">
                        <svg class="u-icon" aria-hidden="true">
                            <use href="./assets/icons/sprite.svg#search"></use>
                        </svg>
                    </button>
                </form>
            </div>
        </header>
        <main class="main">
            <aside class="sidebar">
                <div class="sidebar__head">
                    <button class="button-ghost" title="Close sidebar" type="button">
                        <svg class="u-icon">
                            <use href="./assets/icons/sprite.svg#close"></use>
                        </svg>
                    </button>
                </div>
                <nav class="nav__wrapper">
                    <span class="nav__head">Bookmarks</span>
                    <ul class="nav__list" id="sidebar-container">
                        <li class="nav__list-item">
                            <a href="#all-bookmarks" class="nav-link" data-selected="true" data-target-container="all-bookmarks">
                                <svg class="u-icon">
                                    <use href="./assets/icons/sprite.svg#bookmark"></use>
                                </svg>
                                All bookmarks
                            </a>
                        </li>
                        <li class="nav__list-item">
                            <a href="#collections" class="nav-link" data-target-container="collections">
                                <svg class="u-icon">
                                    <use href="./assets/icons/sprite.svg#collection"></use>
                                </svg>
                                Collections
                            </a>
                        </li>
                        <li class="nav__list-item">
                            <a href="#deleted-bookmarks" class="nav-link" data-target-container="deleted-bookmarks">
                                <svg class="u-icon">
                                    <use href="./assets/icons/sprite.svg#trash-bin"></use>
                                </svg>
                                Recently deleted
                            </a>
                        </li>
                    </ul>
                    <!-- <span class="nav__head">Profiles</span>
                    <ul class="nav__list">
                        <li class="nav__list-item">
                            <a href="#" class="nav-link">
                                <svg class="u-icon">
                                    <use href="./assets/icons/sprite.svg#profile"></use>
                                </svg>
                                All profiles
                            </a>
                        </li>
                        <li class="nav__list-item">
                            <a href="#" class="nav-link">
                                <svg class="u-icon">
                                    <use href="./assets/icons/sprite.svg#trash-bin"></use>
                                </svg>
                                Recently deleted
                            </a>
                        </li>
                    </ul> -->
                </nav>
            </aside>
            <section class="main__content">
                <div id="all-bookmarks" class="content__wrapper">
                    <div class="content__head">
                        <div class="head__name">
                            <h2>All bookmarks</h2>
                        </div>
                        <div class="head__options">
                            <div class="head__options-left">
                                <form name="container-search-form" class="head__search u-search">
                                    <input type="search" title="Search in bookmarks" id="bookmark-search" name="search" placeholder="Search in bookmarks">
                                    <button type="submit" title="search">
                                        <svg class="u-icon" aria-hidden="true">
                                            <use href="./assets/icons/sprite.svg#search"></use>
                                        </svg>
                                    </button>
                                </form>
                            </div>
                            <div class="head__options-right">
                                <button class="button-danger" type="button" id="btn-delete-bookmark">
                                    Delete
                                    <svg class="u-icon">
                                        <use href="./assets/icons/sprite.svg#trash-bin"></use>
                                    </svg>
                                </button>
                                <button class="button-primary" type="button" id="btn-add-bookmark">
                                    Add
                                    <svg class="u-icon">
                                        <use href="./assets/icons/sprite.svg#plus"></use>
                                    </svg>
                                </button>
                                <div class="dropdown" id="dropdown__filter">
                                    <button type="button" class="dropdown__label">
                                        Filter
                                        <svg class="u-icon">
                                            <use href="./assets/icons/sprite.svg#filter"></use>
                                        </svg>
                                    </button>
                                    <div class="dropdown__items">
                                        <button type="button" data-value="FILTER_NAME" class="item button-tertiary">
                                            By name
                                        </button>
                                        <button type="button" data-value="FILTER_URL" class="item button-tertiary">
                                            By URL content
                                        </button>
                                    </div>
                                </div>
                                <div class="dropdown" id="dropdown__sort">
                                    <button type="button" class="dropdown__label">
                                        Sort
                                        <svg class="u-icon">
                                            <use href="./assets/icons/sprite.svg#sort"></use>
                                        </svg>
                                    </button>
                                    <div class="dropdown__items">
                                        <button type="button" data-value="SORT_NAME" class="item button-tertiary">
                                            By name (A-Z)
                                        </button>
                                        <button type="button" data-value="SORT_URL" class="item button-tertiary">
                                            By domain (A-Z)
                                        </button>
                                        <button type="button" data-value="SORT_DATE" class="item button-tertiary">
                                            By creation date
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="table__wrapper bookmark-table">
                        <table>
                        </table>
                    </div>
                </div>
                <div id="collections" class="content__wrapper">
                    <div class="content__head">
                        <div class="head__name">
                            <h2>Collections</h2>
                        </div>
                    </div>
                    <div class="content__body collection__content">
                        <table>
                        </table>
                    </div>
                </div>
                <div id="deleted-bookmarks" class="content__wrapper">
                    <div class="content__head">
                        <div class="head__name">
                            <h2>Deleted Bookmarks</h2>
                        </div>
                    </div>
                </div>
                <div class="footer">
                    <p>&copy; 2026 ZenTabs. All rights reserved.</p>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="./scripts/index.js"></script>
</body>
</html>
